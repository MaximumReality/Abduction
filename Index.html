<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAXIMUM REALITY: Abduction 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: white; }
  canvas { display: block; background: #000; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px; text-align: center; }
  .title { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
  #char-selection { display: none; flex-direction: column; align-items: center; }
  .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
  .char-btn { background: #111; border: 2px solid #444; border-radius: 15px; padding: 10px; cursor: pointer; }
  .char-btn img { width: 60px; height: 60px; object-fit: contain; }
  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 15px; z-index: 100; }
  button { font-size: 30px; width: 70px; height: 70px; background: rgba(0,255,255,0.2); border: 2px solid #0ff; color: white; border-radius: 15px; touch-action: manipulation; }
  #debug-btn { margin-top: 20px; padding: 10px; background: red; color: white; display: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<div id="overlay">
  <div class="title">MAXIMUM REALITY</div>
  <div id="loading-zone">
      <div id="load-text">CONNECTING TO THE GRID...</div>
      <div id="debug-btn" onclick="showSelection()">FORCE START (DEBUG)</div>
  </div>
  <div id="char-selection">
      <h3 style="color:#0ff;">CHOOSE YOUR HERO</h3>
      <div class="char-grid">
        <div class="char-btn" onclick="startGame('lori')"><img src="lori.png"><p>LORI</p></div>
        <div class="char-btn" onclick="startGame('azul')"><img src="azul_sitting.png"><p>AZUL</p></div>
        <div class="char-btn" onclick="startGame('skater')"><img src="mochkil-skate.png"><p>SKATER</p></div>
      </div>
  </div>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <button id="lBtn">⬅️</button>
  <button id="jBtn">⬆️</button>
  <button id="rBtn">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const ASSETS = {
    sky: "gg-bg.png",
    floor: "floor.png",
    bldA: "building-a.png",
    bldB: "building-b.png",
    tank: "cardboard_tank.png",
    lori: "lori.png",
    azul: "azul_sitting.png",
    skater: "mochkil-skate.png",
    loriRun: ["Lori-run.png", "Lori-run2.png", "Lori-run3.png"],
    azulRun: ["Azul-run.png", "Azul-run2.png", "Azul-run3.png"]
};

const imgObj = {};
let loadedCount = 0;
const totalNeeded = 14; 

function loadAll() {
    for (let key in ASSETS) {
        if (Array.isArray(ASSETS[key])) {
            imgObj[key] = ASSETS[key].map(src => {
                const i = new Image();
                i.onload = count;
                i.onerror = count; // Don't freeze if 1 image is missing
                i.src = src;
                return i;
            });
        } else {
            imgObj[key] = new Image();
            imgObj[key].onload = count;
            imgObj[key].onerror = count;
            imgObj[key].src = ASSETS[key];
        }
    }
}

function count() {
    loadedCount++;
    document.getElementById('load-text').innerText = `SYNCING: ${Math.floor((loadedCount/totalNeeded)*100)}%`;
    if (loadedCount >= totalNeeded) showSelection();
}

// If it takes longer than 4 seconds, show the Force Start button
setTimeout(() => { if(loadedCount < totalNeeded) document.getElementById('debug-btn').style.display='block'; }, 4000);

function showSelection() {
    document.getElementById('loading-zone').style.display = 'none';
    document.getElementById('char-selection').style.display = 'flex';
}

let player = { x: 300, y: 0, vy: 0, dir: "right", key: 'lori', jumping: false };
let cameraX = 0, groundY = 0, frame = 0, active = false;
let keys = { left: false, right: false };

function startGame(key) {
    player.key = key;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    active = true;
    resize();
    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    groundY = canvas.height - 100; // Character feet level
    player.y = groundY;
}
window.addEventListener("resize", resize);

// Mobile Touch Events
const bind = (id, k) => {
    const el = document.getElementById(id);
    el.ontouchstart = (e) => { e.preventDefault(); if(k==='jump') { if(!player.jumping){player.vy=-20; player.jumping=true;} } else { keys[k]=true; } };
    el.ontouchend = (e) => { if(k!=='jump') keys[k]=false; };
};
bind('lBtn', 'left'); bind('rBtn', 'right'); bind('jBtn', 'jump');

function loop() {
    if(!active) return;

    // Logic
    if(keys.left) { player.x -= 7; player.dir = "left"; frame += 0.2; }
    if(keys.right) { player.x += 7; player.dir = "right"; frame += 0.2; }
    
    player.vy += 1;
    player.y += player.vy;
    if(player.y > groundY) { player.y = groundY; player.vy = 0; player.jumping = false; }
    
    cameraX = player.x - canvas.width / 2;

    // Draw
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Parallax Sky
    if(imgObj.sky.complete) ctx.drawImage(imgObj.sky, 0, 0, canvas.width, canvas.height);

    // Floor
    if(imgObj.floor.complete) {
        let fX = -cameraX % 128;
        for (let i = -1; i < (canvas.width / 128) + 2; i++) {
            ctx.drawImage(imgObj.floor, (i * 128) + fX, groundY + 20, 128, 128);
        }
    }

    // Player
    let runSet = player.key === 'lori' ? imgObj.loriRun : imgObj.azulRun;
    let img = (keys.left || keys.right) ? runSet[Math.floor(frame % 3)] : imgObj[player.key];

    ctx.save();
    if(player.dir === "left") {
        ctx.translate(player.x - cameraX + 40, 0); ctx.scale(-1, 1);
        ctx.drawImage(img, 0, player.y - 75, 80, 80);
    } else {
        ctx.drawImage(img, player.x - cameraX - 40, player.y - 75, 80, 80);
    }
    ctx.restore();

    requestAnimationFrame(loop);
}

loadAll();
</script>
</body>
</html>

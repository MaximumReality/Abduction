<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAXIMUM REALITY: Abduction 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: white; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px; text-align: center; }
  .loader { font-size: 50px; animation: spin 2s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .title { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff; }
  .title span { color: #00ffff; }
  #char-selection { display: none; flex-direction: column; align-items: center; }
  .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 500px; }
  .char-btn { background: #111; border: 2px solid #444; border-radius: 15px; padding: 10px; cursor: pointer; transition: 0.2s; }
  .char-btn:hover { border-color: #0ff; transform: scale(1.05); }
  .char-btn img { width: 60px; height: 60px; object-fit: contain; }
  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 15px; z-index: 100; }
  button { font-size: 30px; padding: 10px; border-radius: 12px; border: 1px solid #0ff; background: rgba(0,255,255,0.1); color: #fff; backdrop-filter: blur(5px); width: 70px; height: 70px; }
  #stats { position: fixed; top: 20px; right: 20px; font-size: 24px; color: #0ff; display: none; text-shadow: 0 0 5px #0ff; }
  .home-btn { position: fixed; top: 16px; left: 16px; z-index: 2000; background: #ff00ff; color: #fff; padding: 8px 12px; border-radius: 12px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<a href="https://maximumreality.xyz/" class="home-btn">🏠 Home</a>

<div id="overlay">
  <div class="title">MAXIMUM <span>REALITY</span></div>
  <div id="loading-zone">
      <div class="loader">⏳</div>
      <p id="load-text">CONNECTING TO REALITY...</p>
  </div>
  
  <div id="char-selection">
      <h3 style="color:#00ffff; margin-bottom: 20px;">SELECT YOUR CHARACTER</h3>
      <div class="char-grid">
        <div class="char-btn" onclick="selectChar('lori')"><img src="lori.png"><p>LORI</p></div>
        <div class="char-btn" onclick="selectChar('azul')"><img src="azul_sitting.png"><p>AZUL</p></div>
        <div class="char-btn" onclick="selectChar('skater')"><img src="mochkil-skate.png"><p>SKATER</p></div>
      </div>
  </div>
</div>

<div id="stats">SCORE: <span id="scoreVal">0</span></div>
<canvas id="game"></canvas>

<div id="controls">
  <button id="leftBtn">⬅️</button>
  <button id="jumpBtn">⬆️</button>
  <button id="rightBtn">➡️</button>
  <button onclick="location.reload()">🎬</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- ASSET CONFIG ---
const ASSETS_LIST = {
    sky: "gg-bg.png",
    floor: "floor.png",
    building: "building-c.png",
    mochkilCaught: "Mochkil-caught.png",
    puffs: "mochkil_puffs.png",
    tank: "cardboard-tank.png",
    lori: "lori.png",
    azul: "azul_sitting.png",
    skater: "mochkil-skate.png"
};

const imgObj = {};
let assetsLoaded = 0;
const totalAssets = Object.keys(ASSETS_LIST).length;

function loadAssets() {
    for (let key in ASSETS_LIST) {
        imgObj[key] = new Image();
        imgObj[key].onload = () => {
            assetsLoaded++;
            document.getElementById('load-text').innerText = `SYNCING: ${Math.floor((assetsLoaded/totalAssets)*100)}%`;
            if (assetsLoaded >= totalAssets) {
                document.getElementById('loading-zone').style.display = 'none';
                document.getElementById('char-selection').style.display = 'flex';
            }
        };
        imgObj[key].src = ASSETS_LIST[key];
    }
}
loadAssets();

// --- GAME LOGIC ---
let gameState = "START", cameraX = 0, score = 0;
const player = { x: 300, y: 0, vy: 0, speed: 8, jumping: false, dir: "right", img: null };
const ufo = { x: 2000, y: 100, active: false, timer: 0 };
const tank = { x: 1000, speed: 2 };
let groundY = 0;

function selectChar(key) {
    player.img = imgObj[key];
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('stats').style.display = 'block';
    gameState = "PLAY";
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    groundY = canvas.height - 180;
    player.y = groundY;
}
window.addEventListener("resize", resize); resize();

// --- CONTROLS ---
let keys = { left: false, right: false };
document.getElementById('leftBtn').ontouchstart = () => keys.left = true;
document.getElementById('leftBtn').ontouchend = () => keys.left = false;
document.getElementById('rightBtn').ontouchstart = () => keys.right = true;
document.getElementById('rightBtn').ontouchend = () => keys.right = false;
document.getElementById('jumpBtn').ontouchstart = () => {
    if(!player.jumping) { player.vy = -20; player.jumping = true; }
};

function update() {
    if (gameState !== "PLAY") return;

    if (keys.left) { player.x -= player.speed; player.dir = "left"; }
    if (keys.right) { player.x += player.speed; player.dir = "right"; }

    player.vy += 1; 
    player.y += player.vy;
    if (player.y > groundY) { player.y = groundY; player.vy = 0; player.jumping = false; }

    // Tank Movement
    tank.x += tank.speed;
    if (tank.x > player.x + 1000) tank.x = player.x - 1000;

    // UFO Logic
    ufo.timer++;
    if (ufo.timer % 500 === 0) ufo.active = true;
    if (ufo.active) {
        ufo.x = player.x + 100;
        if (ufo.timer % 1000 === 0) ufo.active = false;
    }

    cameraX = player.x - canvas.width / 2;
    score = Math.floor(player.x / 10);
    document.getElementById('scoreVal').innerText = score;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameState !== "PLAY") return;

    // Background
    ctx.drawImage(imgObj.sky, 0, 0, canvas.width, canvas.height);
    
    // Buildings (Parallax)
    for(let i=0; i<10; i++) {
        ctx.drawImage(imgObj.building, (i * 600) - (cameraX * 0.2), groundY - 350, 400, 400);
    }

    // Floor
    let floorMove = -cameraX % 128;
    for (let i = -1; i < (canvas.width / 128) + 2; i++) {
        ctx.drawImage(imgObj.floor, (i * 128) + floorMove, groundY + 60, 128, 128);
    }

    // Tank
    ctx.drawImage(imgObj.tank, tank.x - cameraX, groundY - 60, 200, 150);

    // UFO Abduction Sequence
    if (ufo.active) {
        ctx.fillStyle = "rgba(0, 255, 255, 0.2)";
        ctx.beginPath();
        ctx.moveTo(ufo.x - cameraX + 50, ufo.y + 50);
        ctx.lineTo(ufo.x - cameraX - 50, groundY + 60);
        ctx.lineTo(ufo.x - cameraX + 150, groundY + 60);
        ctx.fill();
        ctx.drawImage(imgObj.mochkilCaught, ufo.x - cameraX + 20, groundY - (ufo.timer % 200), 70, 90);
        ctx.drawImage(imgObj.puffs, ufo.x - cameraX + 100, groundY - 50, 50, 70);
    }
    ctx.font = "80px serif";
    ctx.fillText("🛸", ufo.x - cameraX, ufo.y + 60);

    // Player
    ctx.save();
    if (player.dir === "left") {
        ctx.translate(player.x - cameraX + 40, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(player.img, 0, player.y - 80, 80, 80);
    } else {
        ctx.drawImage(player.img, player.x - cameraX - 40, player.y - 80, 80, 80);
    }
    ctx.restore();

    requestAnimationFrame(draw);
}

function loop() {
    update();
    if (gameState === "PLAY") {
        // draw is now handled by requestAnimationFrame for smoothness
    } else {
        requestAnimationFrame(loop);
    }
}
draw(); // Start draw loop
setInterval(update, 1000/60); // Start physics loop
</script>
</body>
</html>

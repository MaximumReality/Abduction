<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAXIMUM REALITY: Abduction 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: white; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px; text-align: center; }
  .loader { font-size: 50px; animation: spin 2s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .title { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff; }
  .title span { color: #00ffff; }
  #char-selection { display: none; flex-direction: column; align-items: center; }
  .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 500px; }
  .char-btn { background: #111; border: 2px solid #444; border-radius: 15px; padding: 10px; cursor: pointer; transition: 0.2s; }
  .char-btn:hover { border-color: #0ff; transform: scale(1.05); }
  .char-btn img { width: 60px; height: 60px; object-fit: contain; }
  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 15px; z-index: 100; }
  button { font-size: 30px; padding: 10px; border-radius: 12px; border: 2px solid #0ff; background: rgba(0,255,255,0.1); color: #fff; backdrop-filter: blur(5px); width: 70px; height: 70px; touch-action: manipulation; }
  #stats { position: fixed; top: 20px; right: 20px; font-size: 24px; color: #0ff; display: none; }
  .home-btn { position: fixed; top: 16px; left: 16px; z-index: 2000; background: #ff00ff; color: #fff; padding: 8px 12px; border-radius: 12px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<a href="https://maximumreality.xyz/" class="home-btn">🏠 Home</a>

<div id="overlay">
  <div class="title">MAXIMUM <span>REALITY</span></div>
  <div id="loading-zone">
      <div class="loader">⏳</div>
      <p id="load-text">UPLOADING FOLDER DATA...</p>
  </div>
  
  <div id="char-selection">
      <h3 style="color:#00ffff; margin-bottom: 20px;">SELECT YOUR CHARACTER</h3>
      <div class="char-grid">
        <div class="char-btn" onclick="selectChar('lori')"><img src="lori.png"><p>LORI</p></div>
        <div class="char-btn" onclick="selectChar('azul')"><img src="azul_sitting.png"><p>AZUL</p></div>
        <div class="char-btn" onclick="selectChar('skater')"><img src="mochkil-skate.png"><p>SKATER</p></div>
      </div>
  </div>
</div>

<div id="stats">SCORE: <span id="scoreVal">0</span></div>
<canvas id="game"></canvas>

<div id="controls">
  <button id="lBtn">⬅️</button>
  <button id="jBtn">⬆️</button>
  <button id="rBtn">➡️</button>
  <button onclick="location.reload()">🎬</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- UPDATED ASSET LIST (MATCHING YOUR FOLDER) ---
const ASSETS_LIST = {
    sky: "gg-bg.png",
    floor: "floor.png",
    bldA: "building-a.png",
    bldB: "building-b.png",
    bldC: "building-c.png",
    bldD: "building-d.png",
    mochkilCaught: "Mochkil-caught.png",
    tank: "cardboard_tank.png",
    lori: "lori.png",
    azul: "azul_sitting.png",
    skater: "mochkil-skate.png",
    loriRun: ["Lori-run.png", "Lori-run2.png", "Lori-run3.png"],
    azulRun: ["Azul-run.png", "Azul-run2.png", "Azul-run3.png"]
};

const imgObj = {};
let assetsLoaded = 0;
let totalToLoad = 17; // Total files including arrays

function loadAssets() {
    for (let key in ASSETS_LIST) {
        if (Array.isArray(ASSETS_LIST[key])) {
            imgObj[key] = ASSETS_LIST[key].map(src => createImg(src));
        } else {
            imgObj[key] = createImg(ASSETS_LIST[key]);
        }
    }
}

function createImg(src) {
    const img = new Image();
    img.onload = () => { assetsLoaded++; checkReady(); };
    img.onerror = () => { console.error("Failed:", src); assetsLoaded++; checkReady(); };
    img.src = src;
    return img;
}

function checkReady() {
    let p = Math.floor((assetsLoaded / totalToLoad) * 100);
    document.getElementById('load-text').innerText = `SYNCING: ${p}%`;
    if (assetsLoaded >= totalToLoad) {
        document.getElementById('loading-zone').style.display = 'none';
        document.getElementById('char-selection').style.display = 'flex';
    }
}
loadAssets();

// --- GAME LOGIC ---
let gameState = "START", cameraX = 0, frame = 0;
const player = { x: 300, y: 0, vy: 0, speed: 8, jumping: false, dir: "right", key: 'lori' };
const ufo = { x: 2000, y: 80, active: false, timer: 0 };
const tank = { x: 1200, speed: 2.5 };
let groundY = 0;

function selectChar(key) {
    player.key = key;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('stats').style.display = 'block';
    gameState = "PLAY";
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    groundY = canvas.height - 180;
}
window.addEventListener("resize", resize); resize();

// Input
let keys = { left: false, right: false };
document.getElementById('lBtn').ontouchstart = (e) => { e.preventDefault(); keys.left = true; };
document.getElementById('lBtn').ontouchend = () => keys.left = false;
document.getElementById('rBtn').ontouchstart = (e) => { e.preventDefault(); keys.right = true; };
document.getElementById('rBtn').ontouchend = () => keys.right = false;
document.getElementById('jBtn').ontouchstart = (e) => { 
    e.preventDefault(); 
    if(!player.jumping) { player.vy = -22; player.jumping = true; }
};

function update() {
    if (gameState !== "PLAY") return;
    if (keys.left) { player.x -= player.speed; player.dir = "left"; frame += 0.15; }
    if (keys.right) { player.x += player.speed; player.dir = "right"; frame += 0.15; }
    
    player.vy += 1.2; player.y += player.vy;
    if (player.y > groundY) { player.y = groundY; player.vy = 0; player.jumping = false; }

    tank.x += tank.speed;
    if (tank.x > player.x + 1500) tank.x = player.x - 1000;

    ufo.timer++;
    if (ufo.timer % 400 === 0) ufo.active = true;
    if (ufo.active) {
        ufo.x = player.x + 200;
        if (ufo.timer % 800 === 0) ufo.active = false;
    }

    cameraX = player.x - canvas.width / 2;
    document.getElementById('scoreVal').innerText = Math.floor(player.x / 10);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameState !== "PLAY") return;

    // Sky
    ctx.drawImage(imgObj.sky, 0, 0, canvas.width, canvas.height);
    
    // City Layers
    const blds = [imgObj.bldA, imgObj.bldB, imgObj.bldC, imgObj.bldD];
    for(let i=0; i<15; i++) {
        let b = blds[i % 4];
        ctx.drawImage(b, (i * 500) - (cameraX * 0.3), groundY - 320, 350, 400);
    }

    // Tank
    ctx.drawImage(imgObj.tank, tank.x - cameraX, groundY - 70, 220, 160);

    // Floor
    let fX = -cameraX % 128;
    for (let i = -1; i < (canvas.width / 128) + 2; i++) {
        ctx.drawImage(imgObj.floor, (i * 128) + fX, groundY + 50, 128, 128);
    }

    // UFO
    if (ufo.active) {
        ctx.fillStyle = "rgba(255, 0, 255, 0.2)";
        ctx.fillRect(ufo.x - cameraX + 20, 120, 60, groundY - 50);
        ctx.drawImage(imgObj.mochkilCaught, ufo.x - cameraX + 15, groundY - (ufo.timer % 180), 70, 90);
    }
    ctx.font = "70px serif"; ctx.fillText("🛸", ufo.x - cameraX, ufo.y + 60);

    // Player Animation
    let runKey = player.key === 'lori' ? 'loriRun' : 'azulRun';
    let drawImg = (keys.left || keys.right) ? imgObj[runKey][Math.floor(frame % 3)] : imgObj[player.key];
    
    ctx.save();
    if (player.dir === "left") {
        ctx.translate(player.x - cameraX + 40, 0); ctx.scale(-1, 1);
        ctx.drawImage(drawImg, 0, player.y - 80, 85, 85);
    } else {
        ctx.drawImage(drawImg, player.x - cameraX - 40, player.y - 80, 85, 85);
    }
    ctx.restore();
}

function main() { update(); draw(); requestAnimationFrame(main); }
main();
</script>
</body>
</html>

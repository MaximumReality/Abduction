<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAXIMUM REALITY: Abduction 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; font-family: 'Courier New', monospace; color: white; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui-layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 100; }
  .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
  .char-btn { padding: 10px; background: #222; border: 2px solid #ff00ff; border-radius: 10px; text-align: center; }
  .char-btn img { width: 50px; height: 50px; display: block; margin: 0 auto; }
  #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; gap: 20px; }
  .ctrl { width: 70px; height: 70px; background: rgba(0,255,255,0.3); border: 2px solid #0ff; color: white; font-size: 30px; border-radius: 15px; }
</style>
</head>
<body>

<div id="ui-layer">
  <h1 style="color:#ff00ff; text-shadow: 0 0 10px #ff00ff;">MAXIMUM REALITY</h1>
  <p>If images don't load, check file names!</p>
  <div class="btn-grid">
    <div class="char-btn" onclick="initGame('lori')"><img src="lori.png">LORI</div>
    <div class="char-btn" onclick="initGame('azul')"><img src="azul_sitting.png">AZUL</div>
    <div class="char-btn" onclick="initGame('skater')"><img src="mochkil-skate.png">SKATE</div>
  </div>
</div>

<div id="controls">
  <button class="ctrl" id="lBtn">⬅️</button>
  <button class="ctrl" id="jBtn">⬆️</button>
  <button class="ctrl" id="rBtn">➡️</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- ASSET SETUP ---
const images = {};
const sources = {
    sky: "gg-bg.png",
    floor: "floor.png",
    tank: "cardboard_tank.png",
    lori: "lori.png",
    azul: "azul_sitting.png",
    skater: "mochkil-skate.png",
    loriRun: ["Lori-run.png", "Lori-run2.png", "Lori-run3.png"],
    azulRun: ["Azul-run.png", "Azul-run2.png", "Azul-run3.png"]
};

// Simplified loader that doesn't block the game
function loadImages() {
    for (let key in sources) {
        if (Array.isArray(sources[key])) {
            images[key] = sources[key].map(src => {
                let img = new Image(); img.src = src; return img;
            });
        } else {
            images[key] = new Image(); images[key].src = sources[key];
        }
    }
}

let player = { x: 200, y: 0, vy: 0, dir: "right", char: 'lori', jumping: false };
let keys = { left: false, right: false };
let cameraX = 0, groundY = 0, frame = 0, isRunning = false;

function initGame(charKey) {
    player.char = charKey;
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    groundY = window.innerHeight - 120;
    player.y = groundY;
    isRunning = true;
    loadImages();
    requestAnimationFrame(gameLoop);
}

// Touch controls for iPhone
const handleTouch = (id, key, type) => {
    const el = document.getElementById(id);
    el.addEventListener(type, (e) => {
        e.preventDefault();
        if (key === 'jump') { if(!player.jumping) { player.vy = -18; player.jumping = true; } }
        else { keys[key] = (type === 'touchstart'); }
    });
};
handleTouch('lBtn', 'left', 'touchstart'); handleTouch('lBtn', 'left', 'touchend');
handleTouch('rBtn', 'right', 'touchstart'); handleTouch('rBtn', 'right', 'touchend');
handleTouch('jBtn', 'jump', 'touchstart');

function gameLoop() {
    if (!isRunning) return;

    // Physics
    if (keys.left) { player.x -= 6; player.dir = "left"; frame += 0.15; }
    if (keys.right) { player.x += 6; player.dir = "right"; frame += 0.15; }
    
    player.vy += 0.8;
    player.y += player.vy;
    if (player.y > groundY) { player.y = groundY; player.vy = 0; player.jumping = false; }
    
    cameraX = player.x - window.innerWidth / 2;

    // Draw
    ctx.fillStyle = "#111"; // Background fallback
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (images.sky && images.sky.complete) ctx.drawImage(images.sky, 0, 0, canvas.width, canvas.height);

    // Draw Floor
    if (images.floor && images.floor.complete) {
        let fX = -cameraX % 128;
        for (let i = -1; i < (canvas.width / 128) + 2; i++) {
            ctx.drawImage(images.floor, (i * 128) + fX, groundY + 40, 128, 128);
        }
    } else {
        ctx.fillStyle = "#333";
        ctx.fillRect(0, groundY + 40, canvas.width, 100);
    }

    // Draw Player
    let runSet = player.char === 'lori' ? images.loriRun : images.azulRun;
    let pImg = (keys.left || keys.right) ? runSet[Math.floor(frame % 3)] : images[player.char];

    if (pImg && pImg.complete) {
        ctx.save();
        if (player.dir === "left") {
            ctx.translate(player.x - cameraX + 40, 0); ctx.scale(-1, 1);
            ctx.drawImage(pImg, -40, player.y - 80, 80, 80);
        } else {
            ctx.drawImage(pImg, player.x - cameraX - 40, player.y - 80, 80, 80);
        }
        ctx.restore();
    } else {
        ctx.fillStyle = "#ff00ff"; // Pink box if image missing
        ctx.fillRect(player.x - cameraX - 20, player.y - 40, 40, 40);
    }

    requestAnimationFrame(gameLoop);
}

// Ensure canvas is right size
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAXIMUM REALITY: Abduction 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #050505; font-family: 'Courier New', monospace; color: white; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 100; text-align: center; }
  .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
  .char-btn { padding: 10px; background: #111; border: 2px solid #0ff; border-radius: 10px; cursor: pointer; font-size: 10px; }
  .char-btn img { width: 50px; height: 50px; display: block; margin-bottom: 5px; }
  #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; gap: 15px; }
  .ctrl { width: 70px; height: 70px; background: rgba(255,0,255,0.2); border: 2px solid #f0f; color: white; font-size: 30px; border-radius: 50%; touch-action: manipulation; }
</style>
</head>
<body>

<div id="ui">
  <h1 style="color:#f0f; text-shadow: 0 0 10px #f0f;">MAXIMUM REALITY</h1>
  <div class="btn-grid">
    <div class="char-btn" onclick="go('lori')"><img src="lori.png">LORI</div>
    <div class="char-btn" onclick="go('azul')"><img src="azul_sitting.png">AZUL</div>
    <div class="char-btn" onclick="go('skater')"><img src="mochkil-skate.png">SKATE</div>
  </div>
</div>

<div id="controls">
  <button class="ctrl" id="lBtn">⬅️</button>
  <button class="ctrl" id="jBtn">⬆️</button>
  <button class="ctrl" id="rBtn">➡️</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const imgs = {};
const sources = {
    sky: "gg-bg.png", floor: "floor.png", tank: "cardboard_tank.png",
    bld: "building-c.png", lori: "lori.png", azul: "azul_sitting.png",
    skate: "mochkil-skate.png",
    lRun: ["Lori-run.png", "Lori-run2.png", "Lori-run3.png"],
    aRun: ["Azul-run.png", "Azul-run2.png", "Azul-run3.png"]
};

function load() {
    for (let k in sources) {
        if (Array.isArray(sources[k])) imgs[k] = sources[k].map(s => { let i = new Image(); i.src = s; return i; });
        else { imgs[k] = new Image(); imgs[k].src = sources[k]; }
    }
}

let p = { x: 300, y: 0, vy: 0, dir: "right", char: 'lori', jump: false },
    keys = { l: false, r: false }, camX = 0, gY = 0, frame = 0, live = false;

function go(key) {
    p.char = key;
    document.getElementById('ui').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    gY = window.innerHeight - 130;
    p.y = gY;
    live = true;
    load();
    requestAnimationFrame(loop);
}

const tap = (id, k, t) => {
    const el = document.getElementById(id);
    el.addEventListener(t, (e) => {
        e.preventDefault();
        if (k === 'j') { if(!p.jump){ p.vy = -18; p.jump = true; } }
        else { keys[k] = (t === 'touchstart'); }
    });
};
tap('lBtn','l','touchstart'); tap('lBtn','l','touchend');
tap('rBtn','r','touchstart'); tap('rBtn','r','touchend');
tap('jBtn','j','touchstart');

function loop() {
    if (!live) return;
    if (keys.l) { p.x -= 7; p.dir = "left"; frame += 0.2; }
    if (keys.r) { p.x += 7; p.dir = "right"; frame += 0.2; }
    p.vy += 0.8; p.y += p.vy;
    if (p.y > gY) { p.y = gY; p.vy = 0; p.jump = false; }
    camX = p.x - window.innerWidth / 2;

    ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. Sky
    if (imgs.sky?.complete) ctx.drawImage(imgs.sky, 0, 0, canvas.width, canvas.height);
    
    // 2. City Parallax
    if (imgs.bld?.complete) {
        for(let i=0; i<10; i++) ctx.drawImage(imgs.bld, (i*400) - (camX*0.3), gY-300, 300, 400);
    }

    // 3. Tank
    if (imgs.tank?.complete) ctx.drawImage(imgs.tank, 1200 - camX, gY - 60, 180, 130);

    // 4. Floor
    if (imgs.floor?.complete) {
        let fX = -camX % 128;
        for (let i = -1; i < (canvas.width / 128) + 2; i++) ctx.drawImage(imgs.floor, (i*128)+fX, gY+40, 128, 128);
    }

    // 5. Player
    let run = p.char === 'lori' ? imgs.lRun : imgs.aRun;
    let charImg = (keys.l || keys.r) ? run[Math.floor(frame % 3)] : imgs[p.char==='skater'?'skate':p.char];

    if (charImg?.complete) {
        ctx.save();
        ctx.translate(p.x - camX + (p.dir==="left"?40:-40), p.y - 80);
        if (p.dir === "left") ctx.scale(-1, 1);
        ctx.drawImage(charImg, 0, 0, 80, 80);
        ctx.restore();
    }
    requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAXIMUM REALITY: Abduction 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: white; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 100; }
  .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
  .char-btn { padding: 10px; background: #111; border: 2px solid #0ff; border-radius: 15px; cursor: pointer; text-align: center; }
  .char-btn img { width: 60px; height: 60px; object-fit: contain; }
  #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; gap: 20px; z-index: 100; }
  .ctrl { width: 75px; height: 75px; background: rgba(255,0,255,0.2); border: 2px solid #f0f; color: white; font-size: 35px; border-radius: 50%; touch-action: manipulation; }
</style>
</head>
<body>

<div id="ui">
  <h1 style="color:#f0f; text-shadow: 0 0 10px #f0f;">MAXIMUM REALITY</h1>
  <div class="char-grid">
    <div class="char-btn" onclick="start('lori')"><img src="lori.png"><p>LORI</p></div>
    <div class="char-btn" onclick="start('azul')"><img src="azul_sitting.png"><p>AZUL</p></div>
    <div class="char-btn" onclick="start('skater')"><img src="mochkil-skate.png"><p>SKATER</p></div>
  </div>
</div>

<div id="controls">
  <button class="ctrl" id="lBtn">⬅️</button>
  <button class="ctrl" id="jBtn">⬆️</button>
  <button class="ctrl" id="rBtn">➡️</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- YOUR ASSET LOGIC ---
const assets = {};
const toLoad = ['gg-bg.png', 'building-a.png', 'building-b.png', 'building-c.png', 'building-d.png', 'floor.png', 'cardboard_tank.png', 'Mochkil-caught.png'];
// Individual characters and runs
const extras = ['lori.png', 'azul_sitting.png', 'mochkil-skate.png', 'Lori-run.png', 'Lori-run2.png', 'Lori-run3.png', 'Azul-run.png', 'Azul-run2.png', 'Azul-run3.png'];

[...toLoad, ...extras].forEach(src => {
    assets[src] = new Image();
    assets[src].src = src; 
});

let p = { x: 500, y: 0, vy: 0, dir: "right", char: 'lori', jump: false },
    keys = { l: false, r: false }, camX = 0, gY = 0, frame = 0, active = false;

let tank = { x: 1200, speed: -3 }; // Moves West while you move East

function start(key) {
    p.char = key;
    document.getElementById('ui').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    active = true;
    resize();
    requestAnimationFrame(loop);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gY = canvas.height - 160; 
    p.y = gY;
}
window.addEventListener('resize', resize);

// Inputs
const bind = (id, k, t) => {
    document.getElementById(id).addEventListener(t, (e) => {
        e.preventDefault();
        if (k === 'j') { if(!p.jump){ p.vy = -22; p.jump = true; } }
        else { keys[k] = (t === 'touchstart'); }
    });
};
bind('lBtn','l','touchstart'); bind('lBtn','l','touchend');
bind('rBtn','r','touchstart'); bind('rBtn','r','touchend');
bind('jBtn','j','touchstart');

function loop() {
    if (!active) return;

    if (keys.l) { p.x -= 8; p.dir = "left"; frame += 0.2; }
    if (keys.r) { p.x += 8; p.dir = "right"; frame += 0.2; }
    p.vy += 1.2; p.y += p.vy;
    if (p.y > gY) { p.y = gY; p.vy = 0; p.jump = false; }
    
    // Tank logic
    tank.x += tank.speed;
    if (tank.x < p.x - 1000) tank.x = p.x + 1500;

    camX = p.x - window.innerWidth / 2;

    ctx.clearRect(0,0,canvas.width, canvas.height);

    // 1. SKY (Parallax)
    if (assets['gg-bg.png'].complete) {
        let skyX = -(camX * 0.1) % canvas.width;
        ctx.drawImage(assets['gg-bg.png'], skyX, 0, canvas.width, canvas.height);
        ctx.drawImage(assets['gg-bg.png'], skyX + canvas.width, 0, canvas.width, canvas.height);
    }

    // 2. BUILDINGS (Middle Layer)
    const blds = ['building-a.png', 'building-b.png', 'building-c.png', 'building-d.png'];
    blds.forEach((name, i) => {
        if (assets[name].complete) {
            let bX = (i * 600) - (camX * 0.5);
            ctx.drawImage(assets[name], bX, gY - 350, 400, 500);
        }
    });

    // 3. TANK (Road Object)
    if (assets['cardboard_tank.png'].complete) {
        ctx.drawImage(assets['cardboard_tank.png'], tank.x - camX, gY - 60, 220, 160);
    }

    // 4. FLOOR (Covering Layer)
    if (assets['floor.png'].complete) {
        let fW = 128;
        let fX = -camX % fW;
        for (let i = -1; i < (canvas.width / fW) + 2; i++) {
            ctx.drawImage(assets['floor.png'], (i * fW) + fX, gY + 80, fW, fW);
        }
    }

    // 5. CHARACTER
    let runSet = p.char === 'lori' ? ['Lori-run.png', 'Lori-run2.png', 'Lori-run3.png'] : ['Azul-run.png', 'Azul-run2.png', 'Azul-run3.png'];
    let idle = p.char === 'lori' ? 'lori.png' : (p.char === 'azul' ? 'azul_sitting.png' : 'mochkil-skate.png');
    
    let drawImgName = (keys.l || keys.r) ? runSet[Math.floor(frame % 3)] : idle;
    let drawImg = assets[drawImgName];

    if (drawImg && drawImg.complete) {
        ctx.save();
        ctx.translate(p.x - camX, p.y - 10);
        if (p.dir === "left") ctx.scale(-1, 1);
        ctx.drawImage(drawImg, -50, -100, 100, 100);
        ctx.restore();
    }

    requestAnimationFrame(loop);
}
</script>
</body>
</html>
